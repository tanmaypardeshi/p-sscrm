---
layout: default
---
<div class="container">
  <h1>{{ page.title }}</h1>
  {{ content }}
  <ul class="content-list">
    {% assign groups = site.groups | sort: "weight" %}
    {% for group in groups %}
      <li>
        <a href="{{ group.url | relative_url }}">{{ group.title }}</a>
      </li>
    {% endfor %}
  </ul>
</div>
